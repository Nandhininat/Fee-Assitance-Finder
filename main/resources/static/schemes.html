<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ScholarFind - Scholarships</title>

<link rel="stylesheet" href="schemes.css">

</head>

<body>

<header class="navbar">

    <div class="brand">
        🎓 ScholarFind
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="schemes.html" class="active">Scholarships</a>
        <a href="bookmarks.html">Bookmarks</a>
        <a href="notification.html">Notifications</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>


<main class="container">

    <section class="page-header">

        <div>
            <span class="eyebrow">
                GOVERNMENT SUPPORT
            </span>

            <h1>Scholarship Finder</h1>

            <p>
                Discover government scholarships that match your profile.
            </p>
        </div>

        <div class="header-icon">
            🎓
        </div>

    </section>


    <section class="filter-box">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search scholarship name..."
            >

            <button onclick="searchSchemes()">
                🔎 Search
            </button>

        </div>


        <div class="filters">

            <button
                class="filter-btn active"
                onclick="showAll()">
                All
            </button>

            <button
                class="filter-btn"
                onclick="showEligible()">
                🎯 Eligible For Me
            </button>

            <button
                class="filter-btn"
                onclick="showActive()">
                🟢 Active
            </button>

            <button
                class="filter-btn"
                onclick="showExpired()">
                🔴 Expired
            </button>

        </div>

    </section>


    <div class="result-header">

        <h2 id="resultTitle">
            All Scholarships
        </h2>

        <span id="resultCount">
            0 scholarships
        </span>

    </div>


    <div id="loading" class="loading">
        Loading scholarships...
    </div>


    <div id="schemeContainer"
         class="scheme-grid">
    </div>


    <div id="emptyState"
         class="empty-state"
         style="display:none;">

        <div>🔍</div>

        <h3>No scholarships found</h3>

        <p>
            Try another search or filter.
        </p>

    </div>

</main>


<script src="schemes.js"></script>

</body>
</html>
